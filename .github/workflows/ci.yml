name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Verify solution debranding vendor and distribution
        run: node .github/hooks/scripts/verify-solution-debranding.js distribution

      - name: Verify post-review lifecycle routing
        run: node .github/hooks/scripts/verify-solution-debranding.js lifecycle

      - name: Test lifecycle run state
        run: node --test .github/hooks/scripts/tests/lfg-state.test.js

      - name: Plugin marketplace drift check
        run: go run ./cmd/plugingen -check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: latest
          install-mode: goinstall
